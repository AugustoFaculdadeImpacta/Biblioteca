schema: spec-driven
context: |
  Biblioteca escolar reconstruída do zero nesta pasta. Idioma: português do Brasil.
  Backend: Xano; Reflex é a tecnologia adotada e exclusiva do frontend. Outra tecnologia de frontend exige mudança arquitetural aprovada.
  Mitigação 1 cumprida: :focus-visible na busca está implementado e verificado em testes pytest e Playwright.
  A adoção do Reflex não autoriza deploy até que o ambiente acadêmico seja validado, segredos permaneçam somente no backend e os logs sejam inspecionados.
  Estudantes fazem autocadastro com acesso imediato; perfis: estudante, bibliotecário e admin. A conta tem situação ativa; somente admin gere contas bibliotecárias.
  Catálogo público; operações autenticadas e autorizadas no backend.
  Títulos podem ter várias categorias e vários exemplares físicos. Empréstimo: até três empréstimos ativos por estudante, sem repetir título, prazo de 14 dias corridos desde a retirada física. Atraso bloqueia empréstimos e reservas. Reservas por título, FIFO, uma ativa por estudante/título, retirada em 2 dias após disponibilização. Dano/perda torna exemplar indisponível com observação.
  Desenvolver verticalmente: evoluir dados/API com cada capability; não criar o banco isoladamente. Revisar OpenSpec antes de Apply, verificar antes de Archive. Usuário autorizou reconstruir as tabelas antigas no workspace Xano correto após Change aprovada; confirmar destino antes de operação remota.
